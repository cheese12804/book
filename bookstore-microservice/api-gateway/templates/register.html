{% extends 'base.html' %}
{% block title %}Register Customer{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card"><div class="card-body">
      <h4 class="mb-3">Register Customer</h4>
      <form method="post">
        {% csrf_token %}
        <div class="mb-2"><label class="form-label">Name</label>{{ form.name }}</div>
        <div class="mb-2"><label class="form-label">Email</label>{{ form.email }}</div>
        <div class="mb-2"><label class="form-label">Password</label>{{ form.password }}</div>
        <div class="mb-2"><label class="form-label">Address</label>{{ form.address }}</div>
        <button class="btn btn-warning w-100 mt-2">Register & Login</button>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
