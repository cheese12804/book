{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card"><div class="card-body">
      <h4 class="mb-3">Login</h4>
      <form method="post">
        {% csrf_token %}
        <div class="mb-3"><label class="form-label">Email</label>{{ form.email }}</div>
        <div class="mb-3"><label class="form-label">Password</label>{{ form.password }}</div>
        <button class="btn btn-primary w-100">Login</button>
      </form>
      <p class="small mt-3 mb-0">Chưa có tài khoản customer? <a href="{% url 'register' %}">Register</a></p>
    </div></div>
  </div>
</div>
{% endblock %}
