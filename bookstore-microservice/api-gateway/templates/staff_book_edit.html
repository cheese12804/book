{% extends 'base.html' %}
{% block title %}Edit Book{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card"><div class="card-body">
      <h4 class="mb-3">Edit Book #{{ book.id }}</h4>
      <form method="post">
        {% csrf_token %}
        <div class="mb-2"><label class="form-label">Title</label>{{ form.title }}</div>
        <div class="mb-2"><label class="form-label">Author</label>{{ form.author }}</div>
        <div class="row g-2 mb-2">
          <div class="col-6"><label class="form-label">Price</label>{{ form.price }}</div>
          <div class="col-6"><label class="form-label">Stock</label>{{ form.stock }}</div>
        </div>
        <div class="mb-2"><label class="form-label">Description</label>{{ form.description }}</div>
        <div class="mb-2"><label class="form-label">Image URL</label>{{ form.image_url }}</div>
        <div class="d-flex gap-2">
          <button class="btn btn-primary">Save</button>
          <a class="btn btn-outline-secondary" href="{% url 'staff-dashboard' %}">Back</a>
        </div>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
