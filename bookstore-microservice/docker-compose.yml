version: '3.9'
services:
  staff-service:
    build: ./staff-service
    ports: ['8001:8000']
  manager-service:
    build: ./manager-service
    ports: ['8002:8000']
  customer-service:
    build: ./customer-service
    ports: ['8003:8000']
    depends_on: [cart-service]
  catalog-service:
    build: ./catalog-service
    ports: ['8004:8000']
    depends_on: [book-service]
  book-service:
    build: ./book-service
    ports: ['8005:8000']
    depends_on: [staff-service]
  cart-service:
    build: ./cart-service
    ports: ['8006:8000']
    depends_on: [book-service]
  order-service:
    build: ./order-service
    ports: ['8007:8000']
    depends_on: [customer-service, cart-service, book-service, pay-service, ship-service]
  ship-service:
    build: ./ship-service
    ports: ['8008:8000']
  pay-service:
    build: ./pay-service
    ports: ['8009:8000']
  comment-rate-service:
    build: ./comment-rate-service
    ports: ['8010:8000']
    depends_on: [customer-service, book-service]
  recommender-ai-service:
    build: ./recommender-ai-service
    ports: ['8011:8000']
    depends_on: [comment-rate-service, book-service]
  api-gateway:
    build: ./api-gateway
    ports: ['8000:8000']
    depends_on: [book-service, cart-service, order-service, comment-rate-service, recommender-ai-service]
